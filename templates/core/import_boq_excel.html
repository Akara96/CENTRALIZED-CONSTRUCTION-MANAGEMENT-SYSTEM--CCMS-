{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCMS - Import BOQ Excel</title>
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-title {
            color: #0f172a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .file-upload {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-upload:hover {
            border-color: #2563eb;
            background: #f0f9ff;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
        .btn-tock {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-tock:hover {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="form-title">Import BOQ Excel</h2>
        <form method="post" action="{% url 'import_boq_excel' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="project_id">Project</label>
                <select id="project_id" name="project_id" required>
                    <option value="">Select Project...</option>
                    {% for project in raw_projects %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>File BOQ (.xlsx, .xls, .csv)</label>
                <div class="file-upload">
                    <input type="file" id="boq_file" name="boq_file" accept=".xlsx,.xls,.csv" required style="display: none;">
                    <label for="boq_file" style="cursor: pointer;">
                        
                        <div>Klik untuk memilih file atau drag & drop di sini</div>
                    </label>
                </div>
            </div>
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="overwrite" name="overwrite">
                    <label for="overwrite">Substitui item BOQ that in </label>
                </div>
            </div>
            <button type="submit" class="btn-submit">Import BOQ</button>
        </form>
        <a href="{% url 'dashboard' %}" class="btn-tock">â† Kemtoli ke Dashboard</a>
    </div>
</body>
</html>
