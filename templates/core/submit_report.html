{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Daily Report - CCMS</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --color-primary: #3b82f6;
            --color-danger: #ef4444;
            --border-color: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background-color: var(--bg-panel); padding: 2.5rem; border-radius: 16px; border: 1px solid var(--border-color); }
        h1 { color: var(--color-primary); margin-bottom: 2rem; font-size: 1.8rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-weight: 600; }
        input, select, textarea {
            width: 100%; background-color: rgba(15,23,42,0.6); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 0.8rem 1rem; border-radius: 8px; font-size: 1rem;
            color-scheme: dark;
        }
        select option { background-color: #1e293b; color: #f8fafc; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), #2563eb); color: white; border: none;
            padding: 1rem 2rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            background-color: #475569; color: white; border: none; padding: 1rem 2rem; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
        }
        .messages { margin-bottom: 1.5rem; }
        .message { padding: 1rem; border-radius: 8px; margin-bottom: 0.5rem; }
        .message.error { background-color: rgba(239,68,68,0.1); color: var(--color-danger); border: 1px solid rgba(239,68,68,0.3); }
        .message.success { background-color: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .back-link { color: var(--text-secondary); text-decoration: none; margin-bottom: 1.5rem; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'dashboard' %}" class="back-link">â† Kemtoli ke Dashboard</a>
        <h1>Submit Daily Report</h1>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="project">Project</label>
                <select id="project" name="project" required>
                    <option value="">Select Project</option>
                    {% for project in projects %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="weather">Weather</label>
                <input type="text" id="weather" name="weather" placeholder="Example: Sunny, Light Rain" required>
            </div>

            <div class="form-group">
                <label for="work_done">Work that Halo</label>
                <textarea id="work_done" name="work_done" rows="5" placeholder="Describe work completed today" required></textarea>
            </div>

            <div class="form-group">
                <label for="issues">Issues Encountered (optional)</label>
                <textarea id="issues" name="issues" rows="4" placeholder="Describe issues encountered"></textarea>
            </div>

            <div class="form-group">
                <label for="progress_percentage">Persentase Progress (%)</label>
                <input type="number" id="progress_percentage" name="progress_percentage" min="0" max="100" value="0">
            </div>

            <div class="form-group">
                <label for="manpower_count">Amount Tenaga Kerja</label>
                <input type="number" id="manpower_count" name="manpower_count" min="0" value="0">
            </div>

            <div class="form-group">
                <label for="equipment_used">Alat yang Digunaorn (opsil)</label>
                <textarea id="equipment_used" name="equipment_used" rows="3" placeholder="List equipment used"></textarea>
            </div>

            <div class="form-group">
                <label for="materials_used">Materials used (optional)</label>
                <textarea id="materials_used" name="materials_used" rows="3" placeholder="List materials used"></textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <a href="{% url 'dashboard' %}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Submit Report</button>
            </div>
        </form>
    </div>
</body>
</html>
