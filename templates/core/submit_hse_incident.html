{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCMS - Submit HSE Incident</title>
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-title {
            color: #0f172a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
        .btn-tock {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-tock:hover {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="form-title">Submit HSE Report</h2>
        <form method="post" action="{% url 'submit_hse_incident' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="project_id">Project</label>
                <select id="project_id" name="project_id" required>
                    <option value="">Select Project...</option>
                    {% for project in raw_projects %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="report_type">Type Report</label>
                <select id="report_type" name="report_type">
                    <option value="INCIDENT">Incident</option>
                    <option value="NEAR_MISS">Near Miss</option>
                    <option value="DAILY">Daily Report</option>
                    <option value="AUDIT">Audit</option>
                </select>
            </div>
            <div class="form-group">
                <label for="severity">Keparahan</label>
                <select id="severity" name="severity">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HIGH">High</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Describe what happened..."></textarea>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="Incident location...">
            </div>
            <div class="form-group">
                <label for="persons_involved">Orang yang Terlitot</label>
                <input type="number" id="persons_involved" name="persons_involved" placeholder="0">
            </div>
            <div class="form-group">
                <label for="action_taken">Action that Foti</label>
                <textarea id="action_taken" name="action_taken" placeholder="Action taken..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Submit HSE Report</button>
        </form>
        <a href="{% url 'dashboard' %}" class="btn-tock">â† Kemtoli ke Dashboard</a>
    </div>
</body>
</html>
